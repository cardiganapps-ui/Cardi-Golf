# QA-21: dependency updates arrive as pull requests, each through the same CI
# as any other change. Minor and patch versions come grouped, one pull request
# a week; a major version comes on its own, so its breaking changes are read
# and tested by themselves. Merged like any PR, once every check is green. From
# 1 March 2027 until after the trip only security updates are merged (CLAUDE.md
# §0.3).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # Vite, Vitest and their plugins move together: Vite 8 needs Vitest 4 or
      # later, @vitejs/plugin-react 6 and a vite-plugin-pwa that knows it, so a
      # major of one of them alone never passes (PR 201 could not).
      vite:
        patterns: ['vite', 'vitest', '@vitest/*', '@vitejs/*', 'vite-plugin-pwa']
        update-types: [major]
    ignore:
      # TypeScript's majors wait for typescript-eslint, whose peer range ends
      # below 6.1 (8.71, 2026-10-15): TypeScript 7 breaks `npm ci` (PR 200).
      # Lift this when typescript-eslint takes it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The Node types are the oldest runtime we run on (`engines`, Node 22): a
      # newer major types APIs that runtime lacks (PR 202). They move with
      # `engines`, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Mexico_City
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
