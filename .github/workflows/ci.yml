name: CI

on:
  # Branches are checked through their pull request; main is checked on push.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Until M0 scaffolds the app there is no package.json; preflight.sh
      # passes on its own in that case, so the `check` gate exists from day one.
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - run: bash scripts/preflight.sh
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      # QA-15: where coverage stands, by area, on the run's summary (npm test wrote it; the bars are
      # vite.config.ts's). Lint warnings fail the preflight (`eslint --max-warnings 0`), and the build holds the
      # first load's JavaScript to its budget (scripts/check-bundle.mjs) beside the precache's. ARCH-17: lint
      # reads the types, the scripts are type-checked (tsconfig.scripts.json) and an unformatted file fails
      # the preflight's format:check.
      - if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: node scripts/coverage-summary.mjs
      # QA-21: a known high or critical vulnerability in what ships to phones and
      # serverless routes (the production dependencies) fails the check. Dev
      # tooling comes up to date through Dependabot (.github/dependabot.yml).
      # The script runs `npm audit --omit=dev --audit-level=high`, asks again
      # when npm's advisory service gives no report, and says why it failed as
      # an annotation on the check run.
      - if: hashFiles('package-lock.json') != ''
        run: node scripts/audit.mjs
